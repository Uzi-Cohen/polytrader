[project]
name = "polytrader"
version = "0.1.0"
description = "Risk-first Polymarket trader powered by a US government-contracts intelligence layer and a congressional trading mirror"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "typer>=0.12",
    "python-dateutil>=2.9",
    "rich>=13.7",
]

[project.optional-dependencies]
llm = ["anthropic>=0.34"]
dev = ["pytest>=8.0", "pytest-httpx>=0.30", "respx>=0.21"]

[project.scripts]
polytrader = "polytrader.cli:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
